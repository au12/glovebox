name: Build and publish image

on:
  push:
    # main publishes :latest; the CANary branch (the diagnostics section that works with the
    # CANary OBD-II device) publishes :canary until it is merged
    branches: ["main", "CANary"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "CANary"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version to tag the image with (for example 0.2.0)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ inputs.version || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/au12/glovebox

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The CANary analysis is a port of the device firmware's own. This replays a drive the
      # device recorded and fails the build if the server would reach different verdicts.
      - name: Set up .NET for the CANary self-test
        if: hashFiles('tools/CanarySelfTest/CanarySelfTest.csproj') != ''
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: CANary self-test
        if: hashFiles('tools/CanarySelfTest/CanarySelfTest.csproj') != ''
        run: dotnet run --project tools/CanarySelfTest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ (inputs.version || '') == '' && github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ (inputs.version || '') == '' && github.ref == 'refs/heads/main' }}
            type=raw,value=canary,enable=${{ (inputs.version || '') == '' && github.ref == 'refs/heads/CANary' }}
            type=sha,format=short,prefix=canary-,enable=${{ (inputs.version || '') == '' && github.ref == 'refs/heads/CANary' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ (inputs.version || '') != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ (inputs.version || '') != '' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Glovebox
            org.opencontainers.image.description=A redesigned LubeLogger: vehicle maintenance, reminders with ntfy push notifications, and records.
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
